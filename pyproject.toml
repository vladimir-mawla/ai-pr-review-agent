[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Multi-agent PR review system with local-first simulation"
requires-python = ">=3.12"
authors = [
    {name = "Aspire Software", email = "vladimir.mawla@aspiresoftware.com"},
]
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "redis>=5.0,<6",
    "arq>=0.26,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "psycopg[binary]>=3.1,<4",
    "anthropic>=1.0,<2",
    # M9: pgvector's Python adapter (registers the `vector` type with
    # psycopg so a plain list[float] round-trips to/from Postgres's VECTOR
    # column type) and the OpenAI SDK for the real text-embedding-3-large
    # embedder. Neither is a runtime requirement for tests/the demo path --
    # both unit and integration tests use DeterministicFixtureEmbedder, and
    # `openai` is only actually invoked if OPENAI_API_KEY is set AND
    # EMBEDDER_BACKEND=openai (see backend/memory/embedder.py).
    "pgvector>=0.3,<1",
    "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "import-linter>=1.8,<2.0",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -m 'not live'"
asyncio_mode = "auto"
markers = [
    "redis: integration tests that need a real reachable Redis (see docker-compose.yml); skipped automatically when Redis is unreachable.",
    "live: tests that make a real, billable call to a paid external API (Anthropic and/or OpenAI) once the corresponding key is configured. Deselected by default via addopts ('-m \"not live\"'), so a plain `pytest` run never spends money, regardless of what is in .env; run them explicitly with `pytest -m live -v`. A marker (not an env var) was chosen because pytest already has first-class, discoverable, `-ra`-summarized support for marker-based selection/deselection, and because it composes with `-k`/other `-m` expressions instead of requiring a second, parallel opt-in mechanism. Every `live`-marked test/class keeps its own pre-existing `skipif`-on-missing-key guard too (belt and braces): `pytest -m live` with no key configured still skips cleanly with a clear reason, rather than erroring or silently running nothing.",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (ruff format handles this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
# backend/agents/security_agent.py doubles as PLAN.md's M8 CLI demo entry
# point (`python -m backend.agents.security_agent --diff ...`), which must
# print its findings to stdout -- the same CLI-entry-point exception
# scripts/** already gets, scoped to just this one file rather than all of
# backend/agents/.
"backend/agents/security_agent.py" = ["T20"]
# M10: backend/cli/review_local.py is PLAN.md's named M10 demo command's
# entry point (`python -m backend.cli.review_local --diff ... --out ...`),
# which must print its result summary to stdout/stderr -- the identical
# CLI-entry-point exception already granted to security_agent.py above.
"backend/cli/review_local.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
