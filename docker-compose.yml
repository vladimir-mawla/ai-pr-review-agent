# Local development infrastructure for pr-review-agent.
#
# M3 added a single Redis instance backing the real JobQueue
# (backend/job_queue/redis_arq.py) and the ARQ worker
# (backend/job_queue/arq_worker.py). M7 adds a local Postgres instance
# backing the events spine (backend/database/, backend/observability/).
# M9 adds a separate pgvector-enabled Postgres instance backing the
# hybrid-retrieval memory layer (backend/memory/, migrations/scripts/).
#
# NOTE ON THE HOST PORT: Redis's default 6379 was occupied on the build
# machine by an unrelated project's own long-running container
# (`ampliphi-redis-1`, from a different docker-compose project, not
# something this project should stop or touch). To avoid a real conflict
# rather than silently colliding with someone else's service, this
# project's Redis is published on host port 6380 instead, mapped to the
# container's normal 6379. REDIS_URL in .env.example and Settings'
# default both point at 6380 to match. If your machine's 6379 is free,
# you may change the "6380:6379" mapping back to "6379:6379" and update
# REDIS_URL accordingly -- nothing else depends on the specific host port.
services:
  redis:
    # NOTE ON RECREATE: this service has no volume, on purpose -- adding
    # one would be a design change nobody asked for, so this comment only
    # documents current behavior. `docker compose down && docker compose
    # up` therefore starts Redis empty every time (DBSIZE == 0 on boot),
    # which wipes the ARQ job queue AND the idempotency store together
    # (RedisJobQueue's `SET NX EX` keys in backend/job_queue/redis_arq.py
    # live in this same instance). An empty queue after a clean restart is
    # exactly M3's stated success criterion ("no orphaned jobs"); the
    # corollary is that replay protection resets too -- a GitHub delivery
    # this process already saw (and would normally no-op via its
    # idempotency key) looks brand new again after a recreate and gets
    # enqueued a second time. Persisting across recreates would require
    # adding a named volume for Redis's data dir plus AOF/RDB persistence
    # -- neither exists today.
    #
    # COMMAND OVERRIDE (L2 DEBUG, HIGH PRIORITY enqueue fix): `--enable-
    # debug-command yes` turns on Redis's `DEBUG` command family, which
    # `redis-server` refuses by default even from a local connection
    # (Redis >=7 treats "local" as "connected via a Unix socket", not "via
    # a loopback TCP port published by Docker" -- so the plain default
    # rejects DEBUG even from this project's own tests). This is what
    # `tests/integration/test_queue_roundtrip.py::
    # TestConcurrentWebhookEnqueuesAreNotSerializedBySlowRedis` uses
    # (`DEBUG SLEEP <seconds>`) to block the entire, single-threaded Redis
    # server for a fixed duration -- the "slow but not down" condition that
    # regression test (and this fix's own manual latency experiment) needs
    # to reproduce; nothing in `backend/` itself ever issues a `DEBUG`
    # command. Safe here because this compose file is local dev/test
    # infrastructure only (see the ports/no-volume notes above) -- `DEBUG`
    # is never enabled on any real deployment target.
    image: redis:7-alpine
    command: ["redis-server", "--enable-debug-command", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    # M7 scope: the events spine's storage (backend/database/,
    # backend/observability/). Backs the `agent_events` append-only table.
    #
    # NOTE ON THE HOST PORT: Postgres's default 5432 is occupied on the
    # build machine by an unrelated project's own long-running container
    # (`ampliphi-postgres-1`, a different docker-compose project, not
    # something this project should stop or touch) -- same situation, and
    # same fix, as the Redis 6380 note above. This project's Postgres is
    # published on host port 5433 instead, mapped to the container's normal
    # 5432. DATABASE_URL / DATABASE_ADMIN_URL in .env.example and Settings'
    # defaults all point at 5433 to match. If your machine's 5432 is free,
    # you may change the "5433:5432" mapping back to "5432:5432" and update
    # those connection strings accordingly -- nothing else depends on the
    # specific host port. Verified free with `lsof -i :5433` before choosing
    # it (see this milestone's build report for the command output).
    #
    # IMAGE CHOICE: plain `postgres:16-alpine`, deliberately NOT a
    # TimescaleDB image. M7's own freeze-boundary text describes
    # `backend/database/{postgres,models,repository}.py` as building a
    # "local Postgres/SQLite dev schema MIRRORING agent_events" -- i.e. a
    # stand-in for the eventual Tiger Cloud/TimescaleDB hypertable (M12's
    # explicit "Tiger Cloud Migration" scope), not an early adoption of it.
    # M9 (the other pre-Tiger-Cloud milestone) follows the same pattern
    # locally with pgvector rather than jumping straight to Tiger. Reaching
    # for TimescaleDB-specific features here (hypertables, compression,
    # continuous aggregates) at M7 would be scope creep into M12's own
    # ADR-003 four-stage plan. `agent_events` is a plain, ordinary table;
    # migrating it to a hypertable later is exactly one
    # `SELECT create_hypertable('agent_events', 'ts');` call against this
    # same schema, so nothing built here blocks that migration -- it is a
    # deliberate choice, not an oversight.
    #
    # NOTE ON RECREATE: like the Redis service above, this has no volume,
    # on purpose -- `docker compose down && docker compose up` starts
    # Postgres empty every time, so `agent_events` (and the migration-
    # applied schema/roles) are recreated from scratch on every fresh boot.
    # This is fine for a local, ephemeral events log; a durable events
    # store would need a named volume, which nobody has asked for yet.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_review_agent
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_review_agent"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgvector:
    # M9 scope: the hybrid-retrieval memory layer's storage (backend/memory/,
    # migrations/scripts/dev-pgvector-init.sql). Backs the `code_chunks`
    # table -- vector + full-text search over a small seeded set of code
    # chunks, merged by reciprocal rank fusion (backend/memory/
    # context_retriever.py). A SEPARATE Postgres instance from M7's
    # `postgres` service above, on purpose: M7's instance is the events
    # spine's append-only audit log (a completely different schema/
    # workload/lifecycle), and this milestone's freeze boundary describes
    # "the pgvector service" as its own addition to docker-compose.yml, not
    # an extra extension bolted onto the M7 instance -- keeping them
    # separate also means `docker compose down && up` on one never has to
    # reason about the other's schema.
    #
    # NOTE ON THE HOST PORT: by the time this milestone runs, this
    # project's OWN Redis (6380) and Postgres (5433) services (M3/M7,
    # above) are themselves expected to be up via `docker compose up -d`,
    # in addition to the pre-existing, do-not-touch `ampliphi-redis-1`
    # (6379) and `ampliphi-postgres-1` (5432) containers from an unrelated
    # project. That already accounts for 5432, 5433, 6379, and 6380.
    # Verified with `lsof -i :5434` (and, for completeness, re-verified
    # 5432/5433/6379/6380 too) before choosing 5434 -- see this milestone's
    # build report for the exact command output. This project's pgvector
    # is therefore published on host port 5434, mapped to the container's
    # normal 5432. PGVECTOR_URL in .env.example and Settings' default both
    # point at 5434 to match. If your machine's layout differs, change the
    # "5434:5432" mapping and PGVECTOR_URL together -- nothing else depends
    # on the specific host port.
    #
    # IMAGE CHOICE: `pgvector/pgvector:pg16` -- the official pgvector image
    # built on top of `postgres:16`, matching this project's existing
    # `postgres:16-alpine` major-version pin for the M7 service (that image
    # has no pgvector-enabled Alpine variant, so this one is Debian-based
    # rather than Alpine -- an accepted, minor footprint difference, not a
    # design choice anyone need reverse). Pinned to the `pg16` major-version
    # tag (not `latest`), the same granularity of pinning this project
    # already uses for `redis:7-alpine`/`postgres:16-alpine` above.
    #
    # ANN INDEX CHOICE (see migrations/scripts/dev-pgvector-init.sql for the
    # actual DDL): HNSW, not IVFFlat. DiskANN -- the spec's pinned ANN index
    # for the eventual Tiger Cloud deployment (M12) -- is a Timescale/
    # pgvectorscale-only extension, unavailable on plain pgvector; this
    # milestone explicitly stays local/pre-Tiger-Cloud (see M12's own
    # "Tiger Cloud Migration" scope), so it uses one of pgvector's own two
    # ANN index types instead. HNSW over IVFFlat because IVFFlat's
    # `lists` parameter must be chosen relative to the table's row count
    # *at index-build time* (its accuracy degrades badly if the table is
    # near-empty when the index is built, which is exactly this milestone's
    # situation -- `docker compose up -d pgvector` always starts from an
    # empty database, per the NOTE ON RECREATE below), whereas HNSW builds
    # and refines its graph incrementally as rows are inserted and needs no
    # such a-priori row-count tuning. The trade-off (documented, not
    # hidden): HNSW index builds/inserts are more CPU/memory-expensive per
    # row than IVFFlat's, which matters at large scale -- but this
    # milestone's corpus is a few hundred locally-seeded code chunks, where
    # that cost is negligible and HNSW's recall at small/cold-start scale is
    # simply better.
    #
    # NOTE ON RECREATE: like the redis/postgres services above, this has no
    # volume, on purpose -- `docker compose down && up` starts pgvector
    # empty every time, so `code_chunks` (and the `vector` extension/
    # indexes the migration creates) are recreated from scratch on every
    # fresh boot. `scripts/seed_code_chunks.py` re-applies the migration
    # and re-seeds on every run for exactly this reason (see that script).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_review_memory
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_review_memory"]
      interval: 2s
      timeout: 2s
      retries: 15
